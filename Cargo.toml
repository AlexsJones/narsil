[package]
name = "narsil"
version = "0.2.0"
edition = "2024"
description = "A persistent, provider-agnostic agent harness: daemon, TUI, unified memory, autonomous goals"
license = "MIT"
repository = "https://github.com/AlexsJones/narsil"
homepage = "https://github.com/AlexsJones/narsil"
readme = "README.md"

[[bin]]
name = "narsil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dialoguer = "0.12"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
inferno = { version = "0.12.8", default-features = false }
libc = "0.2"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.2"
textwrap = "0.16"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "registry", "std", "ansi"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Optimised, but with the symbols a CPU profiler needs:
#   cargo build --profile profiling && perf record -g target/profiling/narsil ...
[profile.profiling]
inherits = "release"
debug = true
strip = false

[dev-dependencies]
# The tests under tests/ drive the built binary and read what it left behind.
