[package]
name = "narsil"
version = "0.1.0"
edition = "2024"
description = "A persistent, provider-agnostic agent harness: daemon, TUI, unified memory, autonomous goals"

[[bin]]
name = "narsil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dialoguer = "0.12"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
textwrap = "0.16"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
